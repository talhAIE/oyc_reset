<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – OYC Connect</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border-radius: 20px;
      padding: 32px;
      max-width: 400px;
      width: 100%;
      text-align: left;
    }
    h1 { font-size: 1.5rem; margin: 0 0 8px; color: #fff; text-align: center; }
    p { margin: 0 0 24px; color: #94a3b8; font-size: 0.95rem; line-height: 1.5; text-align: center; }
    label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #cbd5e1; }
    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 16px;
    }
    input:focus { outline: none; border-color: #16a34a; }
    .error { color: #f87171; font-size: 0.85rem; margin-top: -10px; margin-bottom: 12px; }
    .success { color: #4ade80; font-size: 0.95rem; margin-bottom: 12px; }
    .btn {
      width: 100%;
      background: #16a34a;
      color: #fff;
      padding: 14px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:hover { background: #15803d; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .muted { font-size: 0.85rem; color: #64748b; margin-top: 24px; text-align: center; }
    #formSection { display: none; }
    #successSection { display: none; }
    #errorSection { display: none; }
    #loadingSection { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>OYC Connect</h1>

    <div id="loadingSection">
      <p id="loadingMessage">Checking your reset link…</p>
    </div>

    <div id="errorSection">
      <p id="errorMessage" class="error"></p>
      <p class="muted">Open the OYC Connect app and use Forgot Password to get a new link.</p>
    </div>

    <div id="formSection">
      <p>Enter your new password below.</p>
      <form id="resetForm">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" minlength="6" placeholder="At least 6 characters" required>
        <p id="passwordError" class="error" style="display: none;"></p>

        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" name="confirm" placeholder="Confirm password" required>
        <p id="confirmError" class="error" style="display: none;"></p>

        <button type="submit" class="btn" id="submitBtn">Update password</button>
      </form>
    </div>

    <div id="successSection">
      <p class="success">Your password has been updated.</p>
      <p>You can now open the OYC Connect app and log in with your new password.</p>
    </div>
  </div>

  <script>
    // Replace with your Supabase project URL and anon key (same as in the app)
    var SUPABASE_URL = 'https://jbjtrppxzbgwbqzcpcib.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpianRycHB4emJnd2JxemNwY2liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4MTA2MTgsImV4cCI6MjA4NjM4NjYxOH0.fbi0cw7UNgswt3FnNXwDPpHOs6tuPDej4kpLfmpPfL8';

    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function show(id) {
      document.getElementById('loadingSection').style.display = 'none';
      document.getElementById('errorSection').style.display = 'none';
      document.getElementById('formSection').style.display = 'none';
      document.getElementById('successSection').style.display = 'none';
      var el = document.getElementById(id);
      if (el) el.style.display = 'block';
    }

    function showError(msg) {
      document.getElementById('errorMessage').textContent = msg;
      show('errorSection');
    }

    function showForm() {
      show('formSection');
    }

    function showSuccess() {
      show('successSection');
    }

    function hasResetParams() {
      // Supabase can send token in hash (#access_token=...) or in query (?code=...) depending on flow
      var hash = window.location.hash;
      var params = new URLSearchParams(window.location.search);
      return (hash && hash.length > 2) || params.has('code');
    }

    async function init() {
      if (!hasResetParams()) {
        showError('Invalid or missing reset link. Use the link from your email.');
        return;
      }

      try {
        var { data, error } = await supabase.auth.getSessionFromUrl({ url: window.location.href });
        if (error) throw error;
        showForm();
        // Clear URL so reload doesn't reuse the token
        if (window.history.replaceState) {
          window.history.replaceState(null, '', window.location.pathname);
        }
      } catch (e) {
        console.error(e);
        showError(e.message || 'This link has expired or is invalid. Request a new one from the app.');
      }
    }

    document.getElementById('resetForm').onsubmit = async function(e) {
      e.preventDefault();
      var password = document.getElementById('password').value;
      var confirmVal = document.getElementById('confirm').value;
      var passwordError = document.getElementById('passwordError');
      var confirmError = document.getElementById('confirmError');
      var submitBtn = document.getElementById('submitBtn');

      passwordError.style.display = 'none';
      confirmError.style.display = 'none';

      if (password.length < 6) {
        passwordError.textContent = 'Password must be at least 6 characters';
        passwordError.style.display = 'block';
        return;
      }
      if (password !== confirmVal) {
        confirmError.textContent = 'Passwords do not match';
        confirmError.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating…';

      try {
        var { error } = await supabase.auth.updateUser({ password: password });
        if (error) throw error;
        await supabase.auth.signOut();
        showSuccess();
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update password';
        confirmError.textContent = err.message || 'Something went wrong. Try again or request a new link.';
        confirmError.style.display = 'block';
      }
    };

    init();
  </script>
</body>
</html>
